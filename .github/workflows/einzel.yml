name: einzel

# Eine einzelne Quelle von Hand laufen lassen (neue Module erproben), ohne den Workflow abruf zu berühren.
# Die Firmentabelle und das Meldungsverzeichnis kommen aus dem Release statt aus einem frischen Lauf.

on:
  workflow_dispatch:
    inputs:
      quelle:
        description: "Quelle"
        type: choice
        options: [sec_ftd, edgar_13f, usaspending, uspto_patente]
      veroeffentlichen:
        description: "Ergebnis in die Releases laden"
        type: boolean
        default: true
      frisch:
        description: "Bestand der Quelle nicht laden, sondern alles neu aufbauen"
        type: boolean
        default: false
      pruefquartal:
        description: "Nur edgar_13f: Gegenprobe der Einzelmeldungen gegen dieses Quartal des Datensatzes (z. B. 2026q2)"
        default: ""

permissions:
  contents: write

concurrency:
  group: einzel-${{ inputs.quelle }}
  cancel-in-progress: false

env:
  KONTAKT_EMAIL: ${{ secrets.KONTAKT_EMAIL }}
  FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
  GH_TOKEN: ${{ github.token }}
  ZEITBUDGET_MIN: "300"
  F13_PRUEFQUARTAL: ${{ inputs.pruefquartal }}

jobs:
  lauf:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Vorlauf und Bestand holen
        run: |
          mkdir -p vorlauf ausgabe/bereinigt
          gh release download pruefbericht -D vorlauf -p "pruefbericht__*.json" --clobber || true
          gh release download bereinigt-edgar -D ausgabe/bereinigt --clobber -p "bereinigt__edgar_firmen__*.parquet"
          case "${{ inputs.quelle }}-${{ inputs.frisch }}" in
            sec_ftd-false)
              gh release download bereinigt-markt -D ausgabe/bereinigt --clobber -p "bereinigt__ftd_*.parquet" || true ;;
            edgar_13f-*)
              gh release download bereinigt-markt -D ausgabe/bereinigt --clobber -p "bereinigt__ftd_wertpapiere__*.parquet"
              jahr=$(date -u +%Y)      # Meldungsverzeichnis: laufendes Jahr und Vorjahr (Quartale ohne Datensatz der SEC)
              gh release download bereinigt-edgar -D ausgabe/bereinigt --clobber \
                -p "bereinigt__edgar_meldungen__${jahr}.parquet" -p "bereinigt__edgar_meldungen__$((jahr - 1)).parquet" ;;&
            edgar_13f-false)
              gh release download bereinigt-edgar -D ausgabe/bereinigt --clobber -p "bereinigt__edgar_13f_*.parquet" || true ;;
            usaspending-false)
              gh release download bereinigt-web -D ausgabe/bereinigt --clobber -p "bereinigt__usaspending_*.parquet" || true ;;
            uspto_patente-false)
              gh release download bereinigt-web -D ausgabe/bereinigt --clobber -p "bereinigt__patente_*.parquet" || true ;;
          esac
          touch ausgabe/.vorher
      - name: Abruf
        run: python -m daten_offen.lauf --quelle "${{ inputs.quelle }}" --modus laufend --vorlauf vorlauf
      - name: Nur eigene, geänderte Ergebnisse weitergeben
        if: always()
        run: |
          rm -f ausgabe/bereinigt/bereinigt__edgar_firmen__*.parquet ausgabe/bereinigt/bereinigt__edgar_meldungen__*.parquet
          if [ "${{ inputs.quelle }}" != "sec_ftd" ]; then rm -f ausgabe/bereinigt/bereinigt__ftd_*.parquet; fi
          find ausgabe/bereinigt \( -name 'bereinigt__ftd_tage__*.parquet' -o -name 'bereinigt__edgar_13f_bestaende__*.parquet' -o -name 'bereinigt__usaspending_monat__*.parquet' \) ! -newer ausgabe/.vorher -delete
          rm -f ausgabe/.vorher
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ${{ inputs.quelle }}
          path: ausgabe
          retention-days: 3
          if-no-files-found: warn

  abschluss:
    needs: lauf
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: ausgabe
          merge-multiple: true
      - name: Prüfbericht anzeigen
        run: |
          for bericht in ausgabe/berichte/pruefbericht__*.md; do
            [ -f "$bericht" ] && cat "$bericht" >> "$GITHUB_STEP_SUMMARY"
          done
          true
      - name: Releases aktualisieren
        if: inputs.veroeffentlichen
        run: bash werkzeuge/veroeffentliche.sh
