name: abruf

on:
  schedule:
    - cron: "20 11 * * 2-6"   # Di–Sa 11:20 UTC: nach dem nächtlichen Neuaufbau der SEC-Sammeldateien und nach dem Tageslauf des Insider-Monitors (10:45 UTC)
  workflow_dispatch:
    inputs:
      modus:
        description: "laufend = nur Neues, rueckwaerts = Historie befüllen"
        type: choice
        options: [laufend, rueckwaerts]
        default: laufend
      kette:
        description: "Zähler der selbst gestarteten Fortsetzungen (nicht von Hand setzen)"
        default: "0"

permissions:
  contents: write
  actions: write

concurrency:
  group: abruf
  cancel-in-progress: false

env:
  KONTAKT_EMAIL: ${{ secrets.KONTAKT_EMAIL }}
  FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
  GH_TOKEN: ${{ github.token }}
  MODUS: ${{ inputs.modus || 'laufend' }}
  KETTE: ${{ inputs.kette || '0' }}
  ZEITBUDGET_MIN: "300"

jobs:
  edgar_index:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Vorlauf holen
        run: |
          mkdir -p vorlauf
          gh release download pruefbericht -D vorlauf -p "pruefbericht__*.json" --clobber || true
      - name: Abruf
        run: python -m daten_offen.lauf --quelle edgar_index --modus "$MODUS" --vorlauf vorlauf
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: edgar_index
          path: ausgabe
          retention-days: 3
          if-no-files-found: warn

  # Quellen, die das Meldungsverzeichnis oder die Firmentabelle brauchen
  folge:
    needs: edgar_index
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        quelle: [edgar_insider, edgar_ereignisse, edgar_xbrl, edgar_rollen, sec_ftd, cfpb, klinik]   # edgar_13f folgt nach dem ersten vollen Lauf im Workflow einzel
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v7
        with:
          name: edgar_index
          path: ausgabe
      - name: Vorlauf und Bestand holen
        run: |
          mkdir -p vorlauf ausgabe/bereinigt
          gh release download pruefbericht -D vorlauf -p "pruefbericht__*.json" --clobber || true
          case "${{ matrix.quelle }}" in
            edgar_insider)
              gh release download bereinigt-edgar -D ausgabe/bereinigt --clobber \
                -p "bereinigt__insider_transaktionen__*.parquet" -p "bereinigt__insider_xml_stand__*.parquet" || true ;;
            edgar_rollen)
              gh release download bereinigt-edgar -D ausgabe/bereinigt --clobber \
                -p "bereinigt__edgar_rollen__*.parquet" || true ;;
            klinik)
              gh release download bereinigt-web -D ausgabe/bereinigt --clobber \
                -p "bereinigt__klinik_studien__*.parquet" -p "bereinigt__klinik_aenderungen__*.parquet" || true ;;
            sec_ftd)
              gh release download bereinigt-markt -D ausgabe/bereinigt --clobber -p "bereinigt__ftd_*.parquet" || true ;;
            edgar_13f)
              # die Bestände früherer Quartale bleiben im Release; das Modul holt das Vorquartal bei Bedarf selbst
              gh release download bereinigt-markt -D ausgabe/bereinigt --clobber -p "bereinigt__ftd_wertpapiere__*.parquet" || true
              gh release download bereinigt-edgar -D ausgabe/bereinigt --clobber                 -p "bereinigt__edgar_13f_dateien__*.parquet" -p "bereinigt__edgar_13f_quartal__*.parquet" -p "bereinigt__edgar_13f_firmen__*.parquet" || true ;;
          esac
          touch ausgabe/.vorher
      - name: Abruf
        run: python -m daten_offen.lauf --quelle "${{ matrix.quelle }}" --modus "$MODUS" --vorlauf vorlauf
      - name: Nur eigene Ergebnisse weitergeben
        if: always()
        run: |
          rm -f ausgabe/bereinigt/bereinigt__edgar_meldungen__*.parquet ausgabe/bereinigt/bereinigt__edgar_firmen__*.parquet
          rm -f ausgabe/berichte/*__edgar_index.*
          if [ "${{ matrix.quelle }}" != "sec_ftd" ]; then rm -f ausgabe/bereinigt/bereinigt__ftd_*.parquet; fi
          # unveränderte Jahresdateien der Lieferausfälle liegen schon im Release
          if [ -f ausgabe/.vorher ]; then
            find ausgabe/bereinigt -name 'bereinigt__ftd_tage__*.parquet' ! -newer ausgabe/.vorher -delete
            rm -f ausgabe/.vorher
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ${{ matrix.quelle }}
          path: ausgabe
          retention-days: 3
          if-no-files-found: warn

  # Quellen ohne Bezug zum Meldungsverzeichnis
  unabhaengig:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        quelle: [fred, wikipedia]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Vorlauf und Bestand holen
        run: |
          mkdir -p vorlauf ausgabe/bereinigt
          gh release download pruefbericht -D vorlauf -p "pruefbericht__*.json" --clobber || true
          if [ "${{ matrix.quelle }}" = "wikipedia" ]; then
            gh release download bereinigt-web -D ausgabe/bereinigt --clobber -p "bereinigt__wiki_wochen__*.parquet" || true
          fi
      - name: Abruf
        run: python -m daten_offen.lauf --quelle "${{ matrix.quelle }}" --modus "$MODUS" --vorlauf vorlauf
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ${{ matrix.quelle }}
          path: ausgabe
          retention-days: 3
          if-no-files-found: warn

  abschluss:
    needs: [edgar_index, folge, unabhaengig]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: ausgabe
          merge-multiple: true
      - name: Releases aktualisieren
        run: bash werkzeuge/veroeffentliche.sh
      - name: Prüfberichte anzeigen
        if: always()
        run: |
          for bericht in ausgabe/berichte/pruefbericht__*.md; do
            [ -f "$bericht" ] && cat "$bericht" >> "$GITHUB_STEP_SUMMARY"
          done
          true
      - name: Fortsetzen, falls ein Lauf am Zeitbudget endete
        run: |
          if ls ausgabe/FORTSETZEN__* >/dev/null 2>&1; then
            if [ "$KETTE" -ge 12 ]; then
              echo "::warning::Zwölf Fortsetzungen in Folge – Kette beendet, bitte von Hand prüfen."
            else
              gh workflow run abruf.yml -f modus=rueckwaerts -f kette="$((KETTE + 1))"
            fi
          fi
